<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный подбор event-подрядчиков</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom styling for the scrollbar for a polished look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row antialiased">

<aside class="w-full md:w-1/3 lg:w-1/4 bg-white shadow-xl z-10 flex flex-col h-screen sticky top-0 overflow-y-auto">
    <div class="p-6 border-b border-slate-100 bg-slate-800 text-white">
        <h1 class="text-xl font-bold tracking-tight mb-1">EventMatch AI</h1>
        <p class="text-xs text-slate-400">Хакатон #79-lite: Умный подбор</p>
    </div>

    <div class="p-6 flex-grow">
        <!-- Demo helpers for the Jury -->
        <div class="mb-6 bg-indigo-50 rounded-lg p-3 border border-indigo-100">
            <p class="text-xs font-semibold text-indigo-800 mb-2 uppercase tracking-wide">Быстрые сценарии (Жюри)</p>
            <div class="flex flex-wrap gap-2">
                <button onclick="fillDemo(1)" class="text-[10px] bg-white border border-indigo-200 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-600 hover:text-white transition">1. Плотная (Ведущий)</button>
                <button onclick="fillDemo(2)" class="text-[10px] bg-white border border-indigo-200 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-600 hover:text-white transition">2. Редкая (Флорист)</button>
                <button onclick="fillDemo(3)" class="text-[10px] bg-white border border-indigo-200 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-600 hover:text-white transition">3. Нет подходящих</button>
                <button onclick="fillDemo(4)" class="text-[10px] bg-white border border-indigo-200 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-600 hover:text-white transition">4. Нет в городе</button>
            </div>
        </div>

        <form id="searchForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Город</label>
                <select id="city" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="Астана">Астана</option>
                    <option value="Алматы">Алматы</option>
                    <option value="Зарубежье">Зарубежье</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Категория</label>
                <select id="category" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="Ведущий">Ведущий</option>
                    <option value="Фотограф">Фотограф</option>
                    <option value="Банкетный зал">Банкетный зал</option>
                    <option value="Флорист">Флорист</option>
                    <option value="Декоратор">Декоратор</option>
                    <option value="Подарки и сувениры">Подарки и сувениры</option>
                    <option value="Отель">Отель</option>
                    <option value="Инструменталист">Инструменталист</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Тип мероприятия</label>
                <select id="eventType" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="свадьба">Свадьба</option>
                    <option value="той">Той</option>
                    <option value="корпоратив">Корпоратив</option>
                    <option value="конференция">Конференция</option>
                    <option value="юбилей">Юбилей</option>
                    <option value="день рождения">День рождения</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Дата</label>
                <input type="date" id="date" required min="2026-09-23" max="2026-12-31" value="2026-10-15" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <p class="text-[10px] text-slate-400 mt-1">Окно 23.09.2026 — 31.12.2026</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Бюджет (₸)</label>
                <input type="number" id="budget" required min="10000" step="5000" placeholder="Например, 500000" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Язык</label>
                    <select id="language" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="любой">Любой</option>
                        <option value="русский">Русский</option>
                        <option value="казахский">Казахский</option>
                        <option value="английский">Английский</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Часы (опц.)</label>
                    <input type="number" id="duration" min="1" max="24" placeholder="Часов" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-md transition duration-200 flex items-center justify-center gap-2">
                <span id="btnText">Подобрать</span>
                <div id="btnSpinner" class="spinner hidden"></div>
            </button>
        </form>
    </div>
</aside>

<main class="w-full md:w-2/3 lg:w-3/4 p-6 lg:p-10 xl:p-14 overflow-y-auto h-screen relative bg-slate-50">

    <!-- Welcome / Empty State -->
    <div id="welcomeState" class="h-full flex flex-col items-center justify-center text-center opacity-100 transition-opacity duration-300">
        <svg class="w-24 h-24 text-slate-300 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
        </svg>
        <h2 class="text-2xl font-bold text-slate-700 mb-2">Настройте параметры поиска</h2>
        <p class="text-slate-500 max-w-md">Заполните форму слева, чтобы наш AI подобрал для вас идеальных подрядчиков с объяснением причины выбора.</p>
    </div>

    <!-- Results Container -->
    <div id="resultsContainer" class="hidden flex-col gap-6 max-w-4xl mx-auto">
        <!-- Header for Results -->
        <div id="resultsHeader" class="mb-2 border-b border-slate-200 pb-4">
            <h2 class="text-2xl font-bold text-slate-800" id="resultTitle">Результаты поиска</h2>
            <p class="text-slate-500 mt-1" id="resultSubtitle">Подобрано кандидатов: 3</p>
        </div>

        <!-- Warning/Error States (States 2 & 3) -->
        <div id="alertBox" class="hidden rounded-lg p-5 mb-4 flex items-start gap-4">
            <svg id="alertIcon" class="w-6 h-6 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></path></svg>
            <div>
                <h3 id="alertTitle" class="font-bold text-lg mb-1"></h3>
                <p id="alertDesc" class="text-sm opacity-90 leading-relaxed"></p>
            </div>
        </div>

        <!-- List of Contractor Cards -->
        <div id="cardsList" class="flex flex-col gap-6">
            <!-- Cards will be injected here via JS -->
        </div>
    </div>

</main>

<script>
    // --- 1. MOCK DATASET (Simulating the anonymized dataset) ---
    const mockDataset = [
        { id: 1, name: "Иван Иванов", cat: "Ведущий", city: "Астана", price: 500000, formats: ["свадьба", "корпоратив", "той"], langs: ["русский", "казахский"], busy: ["2026-10-15", "2026-12-31"], max_h: 8, synthetic: false, desc: "Профессиональный ведущий с 10-летним стажем. Умею заводить толпу на масштабных тоях и держать интригу на корпоративах. Использую интерактивные экраны." },
        { id: 2, name: "Олжас Смагулов", cat: "Ведущий", city: "Астана", price: 350000, formats: ["юбилей", "день рождения", "свадьба", "корпоратив"], langs: ["русский"], busy: ["2026-11-01"], max_h: 6, synthetic: true, desc: "Камерные, уютные мероприятия. Много юмора, стендап-подход, без пошлых конкурсов. Отличный выбор для молодой аудитории." },
        { id: 3, name: "Алиса Лин", cat: "Ведущий", city: "Астана", price: 800000, formats: ["корпоратив", "конференция"], langs: ["английский", "русский"], busy: [], max_h: 10, synthetic: false, desc: "Свободный английский. Провела более 50 международных конференций. Идеальная дикция, строгий тайминг." },
        { id: 4, name: "Ерлан Досов", cat: "Фотограф", city: "Алматы", price: 200000, formats: ["свадьба", "той", "корпоратив"], langs: ["русский", "казахский"], busy: ["2026-10-10"], max_h: null, synthetic: false, desc: "Репортажная и постановочная съемка. Отдаю первые 50 фото уже на следующий день. Снимаю на две камеры, не упускаю ни одной эмоции." },
        { id: 5, name: "Мария Ким", cat: "Фотограф", city: "Алматы", price: 150000, formats: ["день рождения", "юбилей", "корпоратив"], langs: ["русский"], busy: [], max_h: null, synthetic: true, desc: "Люблю живые, не постановочные кадры. Делаю стильную цветокоррекцию под 'пленку'." },
        { id: 6, name: "Grand Hall", cat: "Банкетный зал", city: "Астана", price: 1500000, formats: ["свадьба", "той", "корпоратив"], langs: ["русский", "казахский", "английский"], busy: ["2026-12-25", "2026-12-31", "2026-10-10"], max_h: null, synthetic: false, desc: "Вместимость до 300 человек. Отсутствие колонн, LED-экран 5х3 метра, профессиональный свет и звук включены." },
        { id: 7, name: "Eco Flora", cat: "Флорист", city: "Алматы", price: 120000, formats: ["свадьба", "той", "юбилей"], langs: ["русский"], busy: [], max_h: null, synthetic: false, desc: "Только свежие импортные цветы. Собираю объемные композиции на столы гостей и роскошные президиумы." },
        { id: 8, name: "Асель Art", cat: "Декоратор", city: "Астана", price: 250000, formats: ["свадьба", "корпоратив", "день рождения"], langs: ["русский", "казахский"], busy: ["2026-10-20"], max_h: null, synthetic: true, desc: "Разрабатываю индивидуальный дизайн-проект. Оформляю фотозоны неоном и сухоцветами." },
        { id: 9, name: "John Smith", cat: "Ведущий", city: "Зарубежье", price: 2500000, formats: ["свадьба", "корпоратив", "конференция"], langs: ["английский"], busy: [], max_h: 12, synthetic: false, desc: "Top-tier international host for premium events. Based in Dubai, traveling worldwide." },
        { id: 10, name: "Ritz Conference", cat: "Отель", city: "Алматы", price: 2000000, formats: ["конференция", "корпоратив"], langs: ["английский", "русский", "казахский"], busy: ["2026-11-15", "2026-12-10"], max_h: null, synthetic: false, desc: "Премиальный сервис, 5 залов для секций, подземный паркинг. Кейтеринг от шефа." }
    ];

    // --- 2. DEMO HELPERS (For the jury) ---
    function fillDemo(scenario) {
        const form = document.getElementById('searchForm');
        if (scenario === 1) { // 1. Dense category
            form.city.value = "Астана";
            form.category.value = "Ведущий";
            form.eventType.value = "корпоратив";
            form.date.value = "2026-10-10"; // Not busy for id=1,2,3
            form.budget.value = "600000";   // Matches id=1,2
            form.language.value = "любой";
            form.duration.value = "";
        } else if (scenario === 2) { // 2. Rare category
            form.city.value = "Алматы";
            form.category.value = "Флорист";
            form.eventType.value = "свадьба";
            form.date.value = "2026-10-12";
            form.budget.value = "150000";
            form.language.value = "любой";
            form.duration.value = "";
        } else if (scenario === 3) { // 3. No match (exists but busy/expensive)
            form.city.value = "Астана";
            form.category.value = "Банкетный зал";
            form.eventType.value = "свадьба";
            form.date.value = "2026-12-31"; // Grand Hall is busy
            form.budget.value = "500000"; // Too cheap anyway
            form.language.value = "любой";
            form.duration.value = "";
        } else if (scenario === 4) { // 4. No category in city
            form.city.value = "Астана";
            form.category.value = "Флорист"; // No florists in Astana in our small mock DB
            form.eventType.value = "свадьба";
            form.date.value = "2026-10-15";
            form.budget.value = "100000";
            form.language.value = "любой";
            form.duration.value = "";
        }
    }

    // --- 3. MOCK API ENGINE (Simulates backend filtering & LLM) ---
    function mockApiSearch(req) {
        console.log("Mock API processing request:", req);

        // Phase 1: Check if category exists in city AT ALL
        const basePool = mockDataset.filter(c => c.city === req.city && c.cat === req.cat);
        if (basePool.length === 0) {
            return {
                state: 2,
                title: "Категория не найдена",
                message: `В городе ${req.city} подрядчиков в категории '${req.cat}' не найдено в базе. Попробуйте изменить город или категорию.`
            };
        }

        // Phase 2: Strict Filtering based on conditions
        const filtered = basePool.filter(c => {
            if (c.busy.includes(req.date)) return false; // Busy
            if (c.price > req.budget) return false;      // Too expensive
            if (!c.formats.includes(req.eventType)) return false; // Doesn't do this format
            if (req.lang !== 'любой' && !c.langs.includes(req.lang)) return false; // Language barrier
            if (req.duration && c.max_h !== null && c.max_h < req.duration) return false; // Duration too long
            return true;
        });

        // Phase 3: Check if anything left
        if (filtered.length === 0) {
            return {
                state: 3,
                title: "Нет подходящих кандидатов",
                message: `Кандидаты в категории '${req.cat}' (${req.city}) есть, но ни один не подошел. Причины: заняты на ${req.date}, цена выше вашего бюджета (${req.budget}₸) или не работают на формате '${req.eventType}'.`
            };
        }

        // Phase 4: Sort (by price for determinism) and limit to 3
        filtered.sort((a, b) => a.price - b.price);
        const topCandidates = filtered.slice(0, 3);

        // Phase 5: "LLM" Generation for Explanations
        // We simulate the prompt's instructions: factual, mentions budget, uses description.
        topCandidates.forEach(c => {
            let reason = `Отлично вписывается в бюджет (запрашивает ${c.price.toLocaleString('ru-RU')} ₸). `;

            // Mocking LLM understanding of description context
            if (c.cat === "Ведущий" && c.desc.includes("интерактивные")) {
                reason += `Подрядчик имеет опыт работы с большими аудиториями и использует интерактивные экраны, что хорошо подойдет для формата "${req.eventType}".`;
            } else if (c.cat === "Фотограф") {
                reason += `Специализируется на репортажной съемке форматов типа "${req.eventType}" и отдает готовые материалы в кратчайшие сроки.`;
            } else if (c.cat === "Банкетный зал") {
                reason += `Площадка готова принять ваше мероприятие, оснащена профессиональным светом и звуком без визуальных помех (нет колонн).`;
            } else if (c.desc) {
                // Fallback using part of the description to simulate LLM reading it
                let snippet = c.desc.split('.')[0];
                reason += `Согласно профилю: "${snippet}". Это напрямую закрывает потребности вашего запроса на ${req.date}.`;
            }

            c.explanation = reason;
        });

        return {
            state: 1,
            count: topCandidates.length,
            totalAvailable: filtered.length,
            data: topCandidates
        };
    }

    // --- 4. UI INTERACTION LOGIC ---
    const form = document.getElementById('searchForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    const welcomeState = document.getElementById('welcomeState');
    const resultsContainer = document.getElementById('resultsContainer');
    const cardsList = document.getElementById('cardsList');
    const resultTitle = document.getElementById('resultTitle');
    const resultSubtitle = document.getElementById('resultSubtitle');

    const alertBox = document.getElementById('alertBox');
    const alertIcon = document.getElementById('alertIcon');
    const alertTitle = document.getElementById('alertTitle');
    const alertDesc = document.getElementById('alertDesc');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Gather data
        const requestData = {
            city: document.getElementById('city').value,
            cat: document.getElementById('category').value,
            eventType: document.getElementById('eventType').value,
            date: document.getElementById('date').value,
            budget: parseInt(document.getElementById('budget').value, 10),
            lang: document.getElementById('language').value,
            duration: document.getElementById('duration').value ? parseInt(document.getElementById('duration').value, 10) : null
        };

        // 2. UI Loading State
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
        btnText.textContent = "ИИ анализирует...";
        btnSpinner.classList.remove('hidden');

        welcomeState.classList.add('hidden');
        resultsContainer.classList.add('hidden');
        cardsList.innerHTML = '';
        alertBox.classList.add('hidden');

        // 3. Simulate Network Delay (2 seconds) to showcase the pipeline concept
        setTimeout(() => {
            const response = mockApiSearch(requestData);
            renderResults(response, requestData);

            // Reset UI Loading State
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            btnText.textContent = "Подобрать";
            btnSpinner.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
        }, 1200);
    });

    function renderResults(res, req) {
        resultTitle.textContent = "Результаты подбора";
        resultSubtitle.textContent = `Запрос: ${req.cat}, г. ${req.city}, ${req.date}`;

        // State 2 & 3: Error / No match
        if (res.state === 2 || res.state === 3) {
            alertBox.classList.remove('hidden');
            alertBox.classList.remove('bg-green-50', 'text-green-800', 'border', 'border-green-200');

            if (res.state === 2) {
                alertBox.className = 'rounded-lg p-5 mb-4 flex items-start gap-4 bg-red-50 text-red-900 border border-red-200';
                alertIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>`;
            } else {
                alertBox.className = 'rounded-lg p-5 mb-4 flex items-start gap-4 bg-orange-50 text-orange-900 border border-orange-200';
                alertIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
            }

            alertTitle.textContent = res.title;
            alertDesc.textContent = res.message;
            return;
        }

        // State 1: Success Match
        if (res.count < 3) {
            alertBox.classList.remove('hidden');
            alertBox.className = 'rounded-lg p-4 mb-4 flex items-start gap-3 bg-blue-50 text-blue-900 border border-blue-200';
            alertIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
            alertTitle.textContent = "Найдено меньше 3 вариантов";
            alertDesc.textContent = `Мы нашли ${res.count} профиля, удовлетворяющих всем жестким фильтрам. Остальные заняты на ${req.date} или превышают бюджет.`;
        }

        // Build Cards
        res.data.forEach(contractor => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-300";

            card.innerHTML = `
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                                    ${contractor.name}
                                    ${contractor.synthetic ? `<span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Synthetic</span>` : ''}
                                </h3>
                                <p class="text-sm text-slate-500 font-medium mt-1 flex items-center gap-1.5">
                                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    ${contractor.city} &bull; ${contractor.cat}
                                </p>
                            </div>
                            <div class="text-right">
                                <span class="block text-2xl font-black text-emerald-600">${contractor.price.toLocaleString('ru-RU')} ₸</span>
                                <span class="text-xs text-slate-400">стоимость от</span>
                            </div>
                        </div>

                        <!-- THIS IS THE CRITICAL PART: EXPLANATION HIGHLIGHT -->
                        <div class="mt-4 bg-indigo-50/70 border-l-4 border-indigo-500 p-4 rounded-r-md">
                            <p class="text-xs font-bold text-indigo-800 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                AI-Обоснование
                            </p>
                            <p class="text-slate-800 leading-relaxed text-[15px] font-medium">
                                ${contractor.explanation}
                            </p>
                        </div>
                    </div>
                `;
            cardsList.appendChild(card);
        });
    }
</script>
</body>
