<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный подбор event-подрядчиков (#79-lite)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
<div class="max-w-5xl mx-auto space-y-8">

    <!-- Шапка -->
    <header class="text-center space-y-2">
            <span class="px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-semibold rounded-full border border-indigo-500/30">
                Хакатон #79-lite
            </span>
        <h1 class="text-3xl md:text-4xl font-extrabold text-white">Умный подбор event-подрядчиков</h1>
        <p class="text-slate-400 text-sm max-w-xl mx-auto">
            Сервис подбирает до 3-х подходящих кандидатов и генерирует точное обоснование выбора.
        </p>
    </header>

    <!-- Блок быстрых демо-кнопок для жюри -->
    <div class="demo-card">
        <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">
            Быстрые сценарии для проверки (Definition of Done):
        </h2>
        <div class="flex flex-wrap gap-2">
            <button type="button" onclick="setScenario('dense')" class="btn-demo border-indigo-500/50 text-indigo-300 hover:bg-indigo-600/20">
                1. Плотная категория (Ведущий, Астана)
            </button>
            <button type="button" onclick="setScenario('rare')" class="btn-demo border-purple-500/50 text-purple-300 hover:bg-purple-600/20">
                2. Редкая категория (Флорист, Алматы)
            </button>
            <button type="button" onclick="setScenario('empty')" class="btn-demo border-rose-500/50 text-rose-300 hover:bg-rose-600/20">
                3. Без результата (Заняты / Мал бюджет)
            </button>
        </div>
    </div>

    <!-- Форма и Результаты -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Форма поиска -->
        <form id="searchForm" onsubmit="handleSearch(event)" class="lg:col-span-5 form-card space-y-4">
            <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                <span>🔍</span> Параметры заказа
            </h2>

            <div>
                <label class="form-label">Город</label>
                <select id="city" class="form-input">
                    <option value="Астана" selected>Астана</option>
                    <option value="Алматы">Алматы</option>
                    <option value="Зарубежье">Зарубежье</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="form-label">Дата</label>
                    <input type="date" id="date" value="2026-10-15" class="form-input">
                </div>
                <div>
                    <label class="form-label">Формат</label>
                    <select id="event_type" class="form-input">
                        <option value="корпоратив" selected>Корпоратив</option>
                        <option value="свадьба">Свадьба</option>
                        <option value="той">Той</option>
                        <option value="конференция">Конференция</option>
                        <option value="юбилей">Юбилей</option>
                        <option value="день рождения">День рождения</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="form-label">Категория</label>
                    <select id="category" class="form-input">
                        <option value="Ведущий" selected>Ведущий</option>
                        <option value="Фотограф">Фотограф</option>
                        <option value="Банкетный зал">Банкетный зал</option>
                        <option value="Флорист">Флорист</option>
                        <option value="Декоратор">Декоратор</option>
                        <option value="Инструменталист">Инструменталист</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Бюджет (₸)</label>
                    <input type="number" id="budget" value="500000" step="50000" class="form-input">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="form-label">Длительность (ч)</label>
                    <input type="number" id="duration" placeholder="не ограничено" class="form-input">
                </div>
                <div>
                    <label class="form-label">Язык</label>
                    <select id="language" class="form-input">
                        <option value="">Любой</option>
                        <option value="русский">Русский</option>
                        <option value="казахский">Казахский</option>
                        <option value="английский">Английский</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary w-full mt-4">
                Подобрать подрядчиков
            </button>
        </form>

        <!-- Результаты -->
        <div class="lg:col-span-7 space-y-4">
            <div id="statusBanner" class="hidden status-box"></div>
            <div id="resultsContainer" class="space-y-4">
                <div class="empty-state">
                    Выберите сценарий сверху или заполните форму и нажмите «Подобрать подрядчиков».
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function setScenario(type) {
        if (type === 'dense') {
            document.getElementById('city').value = 'Астана';
            document.getElementById('category').value = 'Ведущий';
            document.getElementById('event_type').value = 'корпоратив';
            document.getElementById('budget').value = 500000;
            document.getElementById('date').value = '2026-10-15';
        } else if (type === 'rare') {
            document.getElementById('city').value = 'Алматы';
            document.getElementById('category').value = 'Флорист';
            document.getElementById('event_type').value = 'свадьба';
            document.getElementById('budget').value = 150000;
            document.getElementById('date').value = '2026-09-25';
        } else if (type === 'empty') {
            document.getElementById('city').value = 'Алматы';
            document.getElementById('category').value = 'Банкетный зал';
            document.getElementById('event_type').value = 'корпоратив';
            document.getElementById('budget').value = 100000;
            document.getElementById('date').value = '2026-12-31';
        }
    }

    async function handleSearch(e) {
        e.preventDefault();
        const container = document.getElementById('resultsContainer');
        const banner = document.getElementById('statusBanner');
        const btn = document.getElementById('submitBtn');

        btn.disabled = true;
        btn.innerText = 'Подбираем...';
        banner.classList.add('hidden');

        const payload = {
            city: document.getElementById('city').value,
            date: document.getElementById('date').value,
            event_type: document.getElementById('event_type').value,
            category: document.getElementById('category').value,
            budget: Number(document.getElementById('budget').value),
            duration: document.getElementById('duration').value ? Number(document.getElementById('duration').value) : null,
            language: document.getElementById('language').value || null
        };

        try {
            // Отправка на FastAPI бэкенд
            const res = await fetch('http://127.0.0.1:8000/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            banner.classList.remove('hidden');
            banner.className = `status-box ${data.status === 'success' ? 'status-success' : 'status-warning'}`;
            banner.innerHTML = `<strong>Статус [${data.status}]:</strong> ${data.message}`;

            if (data.results && data.results.length > 0) {
                container.innerHTML = data.results.map(c => `
                        <div class="card">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-white">${c.name} ${c.synthetic ? '<span class="text-xs text-amber-400 font-normal">(Синтетический)</span>' : ''}</h3>
                                    <span class="text-xs text-slate-400">${c.category} • ${c.city}</span>
                                </div>
                                <span class="price-badge">${c.price.toLocaleString()} ₸</span>
                            </div>
                            <div class="explanation-box">
                                <span class="text-xs uppercase font-bold text-indigo-400 block mb-1">🤖 AI-Обоснование подбора:</span>
                                ${c.explanation}
                            </div>
                        </div>
                    `).join('');
            } else {
                container.innerHTML = `<div class="empty-state">${data.message}</div>`;
            }
        } catch (err) {
            banner.classList.remove('hidden');
            banner.className = 'status-box status-warning';
            banner.innerHTML = '<strong>Ошибка подключения:</strong> Бэкенд на `http://127.0.0.1:8000` не ответил. Запустите uvicorn.';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Подобрать подрядчиков';
        }
    }
</script>
</body>
</html>
